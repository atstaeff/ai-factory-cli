name: Release CLI binaries

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release.yml'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. v0.1.0-rc.1). Must not exist yet.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve version
        id: meta
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
              echo "Manual releases may only run from main" >&2
              exit 1
            fi
            VERSION="${INPUT_VERSION}"
          elif [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            # One-time bootstrap: this workflow file changed on main.
            VERSION="v0.1.0-rc.2"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          if [[ ! "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semver tag: ${VERSION}" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
      - name: Ensure release commit is on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main || { echo 'Release tag is not based on main' >&2; exit 1; }
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Validate Go project
        run: |
          go test ./...
          go vet ./...
      - name: Cross-compile and package
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64 linux/arm64 windows/amd64 windows/arm64 darwin/amd64 darwin/arm64; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            name="factory_${VERSION}_${GOOS}_${GOARCH}"
            mkdir -p "staging/${name}"
            executable="factory"
            if [[ "${GOOS}" == windows ]]; then executable="factory.exe"; fi
            CGO_ENABLED=0 GOOS="${GOOS}" GOARCH="${GOARCH}" go build -trimpath -buildvcs=false -ldflags "-s -w -X github.com/atstaeff/ai-factory-cli/internal/factory.Version=${VERSION}" -o "staging/${name}/${executable}" ./cmd/factory
            if [[ "${GOOS}" == windows ]]; then
              (cd "staging/${name}" && zip -q "../../dist/${name}.zip" "${executable}")
            else
              tar -czf "dist/${name}.tar.gz" -C "staging/${name}" "${executable}"
            fi
          done
          (cd dist && sha256sum factory_* > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: verify-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      - name: Publish GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.verify-and-build.outputs.version }}
        run: |
          set -euo pipefail
          # Never trust a tag alone: release drafts do not resolve via /releases/tags/{tag}.
          # Find the existing draft by release ID so an earlier failed run can recover.
          mapfile -t existing_ids < <(gh api "repos/${GH_REPO}/releases?per_page=100" --jq ".[] | select(.tag_name == \"${VERSION}\") | .id")
          if [[ "${#existing_ids[@]}" -gt 1 ]]; then
            echo "::error::Multiple releases have tag ${VERSION}; refusing to guess."
            exit 1
          fi
          if [[ "${#existing_ids[@]}" -eq 1 ]]; then
            release_id="${existing_ids[0]}"
            is_draft="$(gh api "repos/${GH_REPO}/releases/${release_id}" --jq .draft)"
            echo "Found existing release ID ${release_id} (draft=${is_draft}); checking assets."
          else
            if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" || "${GITHUB_REF}" == "refs/heads/main" ]]; then
              if git ls-remote --tags "https://github.com/${GH_REPO}.git" "refs/tags/${VERSION}" | grep -q .; then
                echo "::error::Tag ${VERSION} exists without a matching release; inspect before retrying."
                exit 1
              fi
              gh release create "${VERSION}" dist/* --draft --prerelease --generate-notes --title "Factory ${VERSION}" --target "${GITHUB_SHA}"
            else
              gh release create "${VERSION}" dist/* --draft --prerelease --generate-notes --title "Factory ${VERSION}" --verify-tag
            fi
            mapfile -t created_ids < <(gh api "repos/${GH_REPO}/releases?per_page=100" --jq ".[] | select(.tag_name == \"${VERSION}\") | .id")
            [[ "${#created_ids[@]}" -eq 1 ]] || { echo "::error::Draft release was not discoverable by release ID"; exit 1; }
            release_id="${created_ids[0]}"
            is_draft="true"
          fi

          echo "Checking that all six binaries and SHA256SUMS exist on release ID ${release_id}"
          mapfile -t expected < <(find dist -maxdepth 1 -type f -printf '%f\n' | sort)
          mapfile -t actual < <(gh api "repos/${GH_REPO}/releases/${release_id}" --jq '.assets[].name' | sort)
          [[ "${#expected[@]}" -eq 7 ]] || { echo "::error::Expected six binary archives plus SHA256SUMS"; exit 1; }
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${actual[@]}")
          if [[ "${is_draft}" == "true" ]]; then
            echo "Publishing validated draft release ${release_id}"
            gh api --method PATCH "repos/${GH_REPO}/releases/${release_id}" -F draft=false >/dev/null
          fi
          gh api "repos/${GH_REPO}/releases/${release_id}" --jq 'if .draft == false and .prerelease == true then "Verified: published prerelease" else error("release not published as prerelease") end'
          echo "Published https://github.com/${GH_REPO}/releases/tag/${VERSION}"
