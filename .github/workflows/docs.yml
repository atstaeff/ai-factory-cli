name: Docs CI

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'examples/**'
      - 'src/**'
      - 'static/**'
      - 'docusaurus.config.js'
      - 'sidebars.js'
      - 'package.json'
      - 'package-lock.json'
      - 'justfile'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: extractions/setup-just@v4
      - name: Install docs dependencies
        run: npm install --no-audit --no-fund
      - name: Validate main /docs branch Pages sources
        run: |
          test -s docs/index.md
          test -s docs/_layouts/default.html
          test -s docs/assets/css/theme.css
          grep -q 'baseurl: "/ai-factory-cli"' docs/_config.yml
      - name: Check Docusaurus compatibility build
        run: just build-docs
