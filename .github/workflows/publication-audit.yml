name: Publication Diagnostics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publication-audit.yml'
  workflow_dispatch:
  workflow_run:
    workflows:
      - Release CLI binaries
      - Publish Docs to GitHub Pages
    types: [completed]

permissions:
  contents: read
  actions: read
  statuses: write
  pages: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect deployment workflows and record commit statuses
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.payload.workflow_run?.head_sha || context.sha;
            const { data } = await github.rest.actions.listWorkflowRunsForRepo({
              owner, repo, per_page: 100
            });
            const watched = [
              ['Release CLI binaries', 'factory/release-workflow'],
              ['Publish Docs to GitHub Pages', 'factory/pages-workflow']
            ];
            for (const [name, statusContext] of watched) {
              const run = data.workflow_runs.find(
                x => x.name === name && (x.event === 'push' || x.event === 'workflow_dispatch')
              );
              const state = !run || run.status !== 'completed' ? 'pending'
                : run.conclusion === 'success' ? 'success' : 'failure';
              const description = run
                ? `${name}: ${run.conclusion || run.status} (run #${run.run_number})`
                : `${name}: no run found`;
              await github.rest.repos.createCommitStatus({
                owner, repo, sha, state, context: statusContext,
                description: description.slice(0, 140),
                target_url: run?.html_url || `https://github.com/${owner}/${repo}/actions`
              });
              core.info(`${statusContext}: ${state}; ${run?.html_url || 'no run'}`);
            }
            try {
              const release = await github.rest.repos.getReleaseByTag({
                owner, repo, tag: 'v0.1.0-rc.2'
              });
              const assets = release.data.assets.map(x => x.name);
              const wanted = [
                'factory_v0.1.0-rc.2_linux_amd64.tar.gz',
                'factory_v0.1.0-rc.2_linux_arm64.tar.gz',
                'factory_v0.1.0-rc.2_windows_amd64.zip',
                'factory_v0.1.0-rc.2_windows_arm64.zip',
                'factory_v0.1.0-rc.2_darwin_amd64.tar.gz',
                'factory_v0.1.0-rc.2_darwin_arm64.tar.gz',
                'SHA256SUMS'
              ];
              const complete = !release.data.draft &&
                wanted.every(x => assets.includes(x)) && assets.length === wanted.length;
              await github.rest.repos.createCommitStatus({
                owner, repo, sha, context: 'factory/release-assets',
                state: complete ? 'success' : 'failure',
                description: complete ? 'rc.2 published with all seven assets' : 'rc.2 missing assets or remains draft',
                target_url: release.data.html_url
              });
              core.info(`release-assets: ${complete ? 'success' : 'failure'}; ${assets.join(', ')}`);
            } catch (error) {
              await github.rest.repos.createCommitStatus({
                owner, repo, sha, context: 'factory/release-assets',
                state: 'failure', description: `rc.2 not published: ${error.status || error.message}`.slice(0,140),
                target_url: `https://github.com/${owner}/${repo}/releases`
              });
              core.warning(`Release check: ${error.message}`);
            }
            try {
              const url = `https://${owner.toLowerCase()}.github.io/${repo}/`;
              const response = await fetch(url, { signal: AbortSignal.timeout(15000) });
              const body = await response.text();
              const healthy = response.ok && body.includes('AI Factory');
              await github.rest.repos.createCommitStatus({
                owner, repo, sha, context: 'factory/pages-live',
                state: healthy ? 'success' : 'failure',
                description: healthy ? 'Public Pages website serves AI Factory' : `Pages HTTP ${response.status}; expected AI Factory HTML`,
                target_url: url
              });
              core.info(`pages-live: ${healthy ? 'success' : 'failure'} HTTP ${response.status}`);
            } catch (error) {
              await github.rest.repos.createCommitStatus({
                owner, repo, sha, context: 'factory/pages-live',
                state: 'failure', description: `Pages unreachable: ${error.message}`.slice(0,140),
                target_url: `https://${owner.toLowerCase()}.github.io/${repo}/`
              });
              core.warning(`Pages check: ${error.message}`);
            }
